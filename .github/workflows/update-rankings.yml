name: Update Rankings

on:
  # Desactivado: el `schedule` de GitHub Actions no es preciso para
  # intervalos de 15 min (confirmado en producción — los huecos reales
  # entre corridas iban de 20 a 100+ minutos, no 15). El disparador real
  # ahora es un cron externo dedicado (cron-job.org) pegándole directo a
  # /api/update-rankings, ver el README. Se deja workflow_dispatch como
  # respaldo manual (pestaña Actions → Run workflow) por si hace falta
  # forzar una corrida sin esperar al cron externo.
  workflow_dispatch: {}

# If a run is still in flight when the next one fires, queue it instead of
# running two ingestions (and two rounds of DB writes) in parallel.
concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/update-rankings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Replace with your real Vercel domain.
          SITE_URL: https://moron-q-challenge.vercel.app
        run: |
          curl --fail-with-body --show-error --silent \
            --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/update-rankings"
